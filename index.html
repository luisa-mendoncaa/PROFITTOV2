<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROFITTO — Dashboards de TV</title>
<link rel="stylesheet" href="style.css?v=5">
<style>
  .menu { flex: 1; display: flex; align-items: center; justify-content: center; gap: 2vw; }
  .card2 { width: 24vw; padding: 5vh 2.2vw 4.6vh; border-radius: 16px; text-decoration: none; color: var(--ink);
    background: var(--glass); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    transition: transform .15s ease, background .15s ease; }
  .card2:hover { transform: translateY(-6px); background: var(--glass-2); }
  .card2 .icon { font-family: var(--f-display); font-weight: 300; font-size: 1.6vh; letter-spacing: .2em; color: var(--accent); margin-bottom: 2.4vh; }
  .card2 h2 { font-family: var(--f-display); font-weight: 400; font-size: 3vh; line-height: 1.25; margin-bottom: 1.4vh; }
  .card2 p { font-size: 1.6vh; color: var(--ink-2); }
</style>
</head>
<body>
<div class="wrap">
  <div id="navHost"></div>
  <div class="menu">
    <a class="card2" href="captacao.html">
      <div class="icon">01</div>
      <h2>Ranking Captação</h2>
      <p>Captação líquida do mês por assessor</p>
    </a>
    <a class="card2" href="intensidade.html">
      <div class="icon">02</div>
      <h2>Ranking de Intensidade</h2>
      <p>Atividade comercial do mês</p>
    </a>
    <a class="card2" href="campanha.html">
      <div class="icon">03</div>
      <h2>Ranking Campanha Semestral</h2>
      <p>Pontuação acumulada da campanha</p>
    </a>
  </div>
  <div class="footer">Abra cada card em uma TV/aba diferente</div>
</div>
<script src="assets.js?v=5"></script>
<script>
renderNav('');
startClock('clock');
setLastUpdate();
</script>
</body>
</html>
