<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking Captação — PROFITTO</title>
<link rel="stylesheet" href="style.css?v=6">
<style>
  /* ===== Mural de captação (dimensionado para TV · tema navy) ===== */
  .cap-mural .pct-cell { display:flex; align-items:center; gap:14px; padding-right:24px; }
  .cap-mural .pct-val  { font-family:var(--f-display); font-size:3vh; font-weight:600; min-width:4.6vw; text-align:right; font-variant-numeric:tabular-nums; }
  .cap-mural .pct-bar  { flex:1; height:1.5vh; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
  .cap-mural .pct-bar > i { display:block; height:100%; border-radius:999px; }
  .cap-mural .num-cell { font-variant-numeric:tabular-nums; }

  .cap-mural .form-cell { display:flex; align-items:center; justify-content:center; gap:10px; }
  .cap-mural .head .form-cell,
  .cap-mural .head .pct-cell { justify-content:center; padding-right:0; }

  .sig { width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
         font-size:16px; font-weight:700; line-height:1; flex:0 0 auto; }
  .sig.ok   { background:#5fcf93; color:#06301b; }  /* >= 100%          */
  .sig.mid  { background:#f0c66e; color:#3a2a05; }  /* 50–99%           */
  .sig.no   { background:#f7b3aa; color:#5a1a12; }  /* 0–49%  → vermelho claro */
  .sig.neg  { background:#8e1414; color:#ffd9d4; font-size:13px; } /* captação negativa → vermelho escuro */
  .sig.na   { background:transparent; color:#6f7fa3; font-size:20px; font-weight:600; letter-spacing:-1px; } /* fora da equipe */
  /* último mês em destaque */
  .sig.last { width:34px; height:34px; font-size:18px; margin-left:4px; }
  .sig.ok.last  { box-shadow:0 0 0 2px #0c1c3b, 0 0 0 4px #5fcf93; }
  .sig.mid.last { box-shadow:0 0 0 2px #0c1c3b, 0 0 0 4px #f0c66e; }
  .sig.no.last  { box-shadow:0 0 0 2px #0c1c3b, 0 0 0 4px #f7b3aa; }
  .sig.neg.last { font-size:16px; box-shadow:0 0 0 2px #0c1c3b, 0 0 0 4px #c43a33; }
  .sig.na.last  { box-shadow:none; font-size:24px; }

  /* ===== Filtros ===== */
  .cap-filtros { display:flex; align-items:center; gap:1.4vw; flex-wrap:wrap; margin:0 0 1.4vh; }
  .cap-filtros .grp { display:flex; align-items:center; gap:.5vw; }
  .cap-filtros .lbl { font-family:var(--f-display); font-size:1.25vh; letter-spacing:.16em; color:var(--ink-3); text-transform:uppercase; }
  .cap-filtros input[type=search] { font:inherit; font-size:1.5vh; color:var(--ink); background:rgba(255,255,255,.05);
      border:1px solid var(--line); border-radius:999px; padding:.7vh 1vw; width:14vw; min-width:160px; outline:none; }
  .cap-filtros input[type=search]:focus { border-color:rgba(163,184,242,.55); }
  .cap-filtros input[type=search]::placeholder { color:var(--ink-3); }
  .chip { font-family:var(--f-display); font-size:1.35vh; color:var(--ink-2); background:transparent; cursor:pointer;
          border:1px solid var(--line); border-radius:999px; padding:.55vh .8vw; display:inline-flex; align-items:center; gap:6px; }
  .chip:hover { color:var(--ink); background:rgba(255,255,255,.05); }
  .chip.on { color:var(--ink); background:rgba(163,184,242,.14); border-color:rgba(163,184,242,.45); }
  .chip .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .chip.limpar { border-style:dashed; color:var(--ink-3); margin-left:auto; }
  .cap-count { font-size:1.3vh; color:var(--ink-3); }
  .cap-mural .simple-row:not(.head) { max-height:7vh; }
  .cap-vazio { padding:4vh; text-align:center; color:var(--ink-3); font-size:1.8vh; }

  .form-legend { display:flex; gap:22px; justify-content:center; align-items:center; flex-wrap:wrap;
                 margin:1.4vh 4px 0; font-size:1.35vh; color:var(--ink-2); }
  .form-legend span { display:inline-flex; align-items:center; gap:7px; }
  .form-legend .sig { width:20px; height:20px; font-size:11px; }
  .form-legend .sig.na { width:auto; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="navHost"></div>
  <div id="filtrosHost"></div>
  <div id="content" class="simple-table barlist cap-mural"><div class="loading">Carregando dados da planilha…</div></div>
  <div id="legendHost"></div>
  <div class="footer">Fonte: PROFITTO_DAY_v2 · abas admin_total e hist_captacao · atualiza a cada 60s</div>
</div>

<script src="assets.js?v=6"></script>
<script>
const SHEET_ID  = '1IcGygIIk6TUQBf4Vcx-KOtD2RDK5y0dbAcELr_U6KBs';
const TAB_NAME  = 'admin_total';
const HIST_TAB  = 'hist_captacao';   // A=Assessor | B=Cluster | C=Filial | D..=meses (jan./26…) | Total | Média
const NIVEIS    = ['Sênior', 'Pleno', 'Júnior'];
const COLS_GRID = '5% 25% 16% 28% 26%';
const N_MESES   = 5;

// Faixas (mesma régua do Quadro da Equipe)
const LIM_BATIDA = 100;   // >= 100%      → verde ✓
const LIM_MEIO   = 50;    // 50–99%       → amarelo –
                          // 0–49%        → vermelho claro ✕
                          // captação < 0 → vermelho ▼

// ---------- filtros / ordenação (estado mantido entre atualizações) ----------
const FILTRO_KEY = 'profitto_cap_filtros_v1';
const estado = { busca:'', captado:'todos', faixa:'todas', sort:'total', dir:'desc' };
try { Object.assign(estado, JSON.parse(localStorage.getItem(FILTRO_KEY) || '{}')); } catch (e) {}
function salvarEstado() { try { localStorage.setItem(FILTRO_KEY, JSON.stringify(estado)); } catch (e) {} }
let ultimoData = [], ultimoHist = { labels: [] };

const OPC_CAPTADO = [['todos','Todos'], ['pos','Positiva'], ['neg','Negativa']];
const OPC_FAIXA   = [['todas','Todas',null], ['ok','Bateu','#5fcf93'], ['mid','50–99%','#f0c66e'], ['no','< 50%','#f7b3aa'], ['neg','Negativa','#8e1414']];

function mountFiltros() {
  const host = document.getElementById('filtrosHost');
  if (!host || host.dataset.ok) return;
  host.dataset.ok = '1';
  const chips = (grupo, opcs) => opcs.map(([v, t, c]) =>
    '<button class="chip" data-g="' + grupo + '" data-v="' + v + '">' + (c ? '<i class="dot" style="background:' + c + '"></i>' : '') + t + '</button>').join('');
  host.innerHTML = '<div class="cap-filtros">' +
    '<div class="grp"><span class="lbl">Assessor</span><input type="search" id="fBusca" placeholder="Buscar nome…" autocomplete="off"></div>' +
    '<div class="grp"><span class="lbl">Captado</span>' + chips('captado', OPC_CAPTADO) + '</div>' +
    '<div class="grp"><span class="lbl">% da meta</span>' + chips('faixa', OPC_FAIXA) + '</div>' +
    '<span class="cap-count" id="fCount"></span>' +
    '<button class="chip limpar" id="fLimpar">Limpar filtros</button>' +
  '</div>';
  const busca = document.getElementById('fBusca');
  busca.value = estado.busca;
  busca.addEventListener('input', () => { estado.busca = busca.value; salvarEstado(); render(); });
  host.addEventListener('click', ev => {
    const b = ev.target.closest('.chip[data-g]');
    if (!b) return;
    estado[b.dataset.g] = b.dataset.v; salvarEstado(); render();
  });
  document.getElementById('fLimpar').addEventListener('click', () => {
    Object.assign(estado, { busca:'', captado:'todos', faixa:'todas', sort:'total', dir:'desc' });
    busca.value = ''; salvarEstado(); render();
  });
  document.getElementById('content').addEventListener('click', ev => {
    const h = ev.target.closest('.sort-head');
    if (!h) return;
    const k = h.dataset.k;
    if (estado.sort === k) estado.dir = estado.dir === 'desc' ? 'asc' : 'desc';
    else { estado.sort = k; estado.dir = k === 'nome' ? 'asc' : 'desc'; }
    salvarEstado(); render();
  });
}

function mountCapTotalBadge() {
  const topbar = document.querySelector('.topbar');
  const meta = document.querySelector('.meta');
  if (!topbar || !meta || document.getElementById('capTotal')) return;
  const badge = document.createElement('div');
  badge.className = 'cap-total-badge';
  badge.innerHTML = '<span class="cap-total-lbl">CAP TOTAL</span><span class="cap-total-val" id="capTotal">--</span>';
  topbar.insertBefore(badge, meta);
}

// ---------- helpers ----------
const normName = s => (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/\(.*?\)/g, '').trim().toLowerCase().replace(/\s+/g, ' ');
const escHtml  = s => (s || '').toString().replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

// Lê "5863064.50", "-829.00", "R$ 1.234.567,89", "(R$ 188.906)", "-R$ 486.912,75"
function parseMoney(v) {
  if (v === null || v === undefined) return null;
  let s = v.toString().trim();
  if (!s || s === '-' || s === '—') return null;
  const neg = /^\(.*\)$/.test(s) || s.includes('-');
  s = s.replace(/[R$\s()\-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isNaN(n) ? null : (neg ? -n : n);
}

// "Andre Jocksch" (admin_total) ↔ "Andre Cristiano Capitanio Jocksch" (hist_captacao)
function sameAssessor(curto, completo) {
  const a = normName(curto).split(' '), b = normName(completo).split(' ');
  return a[0] === b[0] && a.every(t => b.includes(t));
}

const MESES_PT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function mesAtualLabel() {
  const d = new Date();
  return MESES_PT[d.getMonth()] + './' + String(d.getFullYear()).slice(-2);
}
const normLabel = s => (s || '').toString().trim().toLowerCase();

function faixa(valor, meta) {
  if (valor === null) return 'na';
  if (valor < 0) return 'neg';
  const p = meta > 0 ? valor / meta * 100 : 0;
  if (p >= LIM_BATIDA) return 'ok';
  if (p >= LIM_MEIO) return 'mid';
  return 'no';
}
const COR  = { ok:'#7fdca6', mid:'#f0c66e', no:'#f7b3aa', neg:'#ff7b70', na:'#6f7fa3' };
const ICON = { ok:'✓', mid:'–', no:'✕', neg:'▼', na:'--' };

function signal(valor, meta, label, isLast) {
  const f = faixa(valor, meta);
  const tip = f === 'na' ? label + ': fora da equipe'
    : label + ': ' + fmtBRLShort(valor) + (meta > 0 ? ' · ' + (valor / meta * 100).toFixed(0) + '% da meta' : '');
  return '<span class="sig ' + f + (isLast ? ' last' : '') + '" title="' + escHtml(tip) + '">' + ICON[f] + '</span>';
}

// Lê hist_captacao e devolve os 5 últimos meses FECHADOS (antes do mês corrente)
async function loadHistorico() {
  const out = { rows: [], labels: [], inativos: [] };
  try {
    const rows = await fetchSheetRows(SHEET_ID, HIST_TAB);
    let hdr = rows.find(r => normName(r[0]) === 'assessor');
    let firstCol = 3, lastCol;
    if (hdr) {
      lastCol = hdr.findIndex((h, i) => i >= firstCol && ['total', 'media'].includes(normName(h)));
      if (lastCol < 0) lastCol = hdr.length;
    } else {                                         // sem cabeçalho: assume jan..mês atual
      lastCol = firstCol + new Date().getMonth() + 1;
      hdr = [];
      for (let i = firstCol; i < lastCol; i++) hdr[i] = MESES_PT[i - firstCol] + './' + String(new Date().getFullYear()).slice(-2);
    }
    // mês corrente fica de fora (está em andamento)
    let fim = lastCol;
    const idxAtual = hdr.findIndex((h, i) => i >= firstCol && i < lastCol && normLabel(h) === mesAtualLabel());
    if (idxAtual >= 0) fim = idxAtual;
    const ini = Math.max(firstCol, fim - N_MESES);
    const cols = [];
    for (let i = ini; i < fim; i++) cols.push(i);
    out.labels = cols.map(i => (hdr[i] || '').toString().trim());

    for (const r of rows) {
      const nome = (r[0] || '').toString().trim();
      if (!nome || r === hdr) continue;
      if (/inativo/i.test(nome)) { out.inativos.push(nome); continue; }
      out.rows.push({ nome, valores: cols.map(i => parseMoney(r[i])) });
    }
  } catch (e) {
    console.warn('Histórico indisponível:', e.message);
  }
  return out;
}

// ---------- render (aplica filtros + ordenação sobre o último carregamento) ----------
function render() {
  const hist = ultimoHist;
  const q = normName(estado.busca);
  let data = ultimoData.filter(d =>
    (!q || normName(d.nome).includes(q)) &&
    (estado.captado === 'todos' || (estado.captado === 'pos' ? d.total >= 0 : d.total < 0)) &&
    (estado.faixa === 'todas' || d.faixa === estado.faixa));
  const k = estado.sort, m = estado.dir === 'asc' ? 1 : -1;
  data = data.slice().sort((a, b) => k === 'nome'
    ? m * a.nome.localeCompare(b.nome, 'pt-BR')
    : m * ((a[k] - b[k]) || (a.rank - b.rank)));

  document.querySelectorAll('#filtrosHost .chip[data-g]').forEach(b =>
    b.classList.toggle('on', estado[b.dataset.g] === b.dataset.v));
  const cnt = document.getElementById('fCount');
  if (cnt) cnt.textContent = data.length === ultimoData.length ? '' : data.length + ' de ' + ultimoData.length;

  const seta = key => estado.sort === key ? (estado.dir === 'asc' ? '▴' : '▾') : '▾';
  const hd = (key, cls, txt, st) => '<div class="cell ' + cls + ' sort-head' + (estado.sort === key ? ' active' : '') +
    '" data-k="' + key + '" title="Ordenar"' + (st ? ' style="' + st + '"' : '') + '>' + txt + '<span class="sort-arrow">' + seta(key) + '</span></div>';

  let html = '<div class="simple-row head" style="grid-template-columns:' + COLS_GRID + '">' +
    '<div class="cell pos-cell">#</div>' +
    hd('nome', 'name-cell', 'ASSESSOR', 'justify-content:flex-start') +
    hd('total', 'num-cell', 'CAPTADO') +
    hd('pct', 'pct-cell', '% DA META') +
    '<div class="cell form-cell">ÚLTIMOS 5 MESES</div>' +
    '</div>';

  data.forEach(d => {
    const pos = d.rank;   // posição sempre pelo ranking de captação
    const rankCls = pos === 1 ? ' gold' : pos === 2 ? ' silver' : pos === 3 ? ' bronze' : '';
    const valCls  = d.total >= 0 ? 'pos-val' : 'neg-val';
    const cor     = COR[d.faixa];
    const largura = Math.max(0, Math.min(100, d.pct));
    const sinais  = d.forma.map((v, k) => signal(v, d.meta, hist.labels[k], k === d.forma.length - 1)).join('');

    html += '<div class="simple-row" style="grid-template-columns:' + COLS_GRID + '">' +
      '<div class="cell pos-cell' + rankCls + '">' + pos + '</div>' +
      '<div class="cell name-cell"><span class="nm">' + escHtml(d.nome) + '</span><span class="lvl">' + escHtml(d.nivel) + '</span></div>' +
      '<div class="cell num-cell ' + valCls + '">' + fmtBRLShort(d.total) + '</div>' +
      '<div class="cell pct-cell" title="Meta: ' + fmtBRLShort(d.meta) + '">' +
        '<span class="pct-val" style="color:' + cor + '">' + (d.meta > 0 ? d.pct.toFixed(0) + '%' : '—') + '</span>' +
        '<div class="pct-bar"><i style="width:' + largura + '%;background:' + cor + '"></i></div>' +
      '</div>' +
      '<div class="cell form-cell">' + sinais + '</div>' +
      '</div>';
  });
  if (!data.length) html += '<div class="cap-vazio">Nenhum assessor com esses filtros.</div>';

  const container = document.getElementById('content');
  container.className = 'simple-table barlist cap-mural';
  container.innerHTML = html;

  document.getElementById('legendHost').innerHTML =
    '<div class="form-legend">' +
      '<span><i class="sig ok">✓</i> Bateu a meta (≥ ' + LIM_BATIDA + '%)</span>' +
      '<span><i class="sig mid">–</i> ' + LIM_MEIO + '% a ' + (LIM_BATIDA - 1) + '% da meta</span>' +
      '<span><i class="sig no">✕</i> Abaixo de ' + LIM_MEIO + '%</span>' +
      '<span><i class="sig neg">▼</i> Captação negativa</span>' +
      '<span><i class="sig na">--</i> Fora da equipe</span>' +
      (hist.labels.length ? '<span>Meses fechados · ' + escHtml(hist.labels[0]) + ' → ' + escHtml(hist.labels[hist.labels.length - 1]) + '</span>' : '') +
    '</div>';
}

// ---------- carregamento ----------
async function load() {
  try {
    mountCapTotalBadge();
    const [rows, hist] = await Promise.all([fetchSheetRows(SHEET_ID, TAB_NAME), loadHistorico()]);

    const data = [];
    let capTotal = 0;   // CAP TOTAL do escritório inclui inativos
    for (const r of rows) {
      const nivel = (r[2] || '').trim();
      const nome  = (r[1] || '').trim();
      if (!NIVEIS.includes(nivel) || !nome) continue;
      const total = parseNumBR(r[5]);
      const meta  = parseNumBR(r[7]);
      capTotal += total;
      if (hist.inativos.some(x => sameAssessor(nome, x))) continue;   // marcado (inativo) na hist_captacao
      const pct   = meta > 0 ? (total / meta) * 100 : 0;
      const h = hist.rows.find(x => sameAssessor(nome, x.nome));
      const forma = h ? h.valores : hist.labels.map(() => null);
      data.push({ nome, nivel, total, meta, pct, forma });
    }
    data.sort((a, b) => b.total - a.total);
    data.forEach((d, i) => { d.rank = i + 1; d.faixa = faixa(d.total, d.meta); });
    ultimoData = data; ultimoHist = hist;

    const capTotalEl = document.getElementById('capTotal');
    if (capTotalEl) {
      capTotalEl.textContent = fmtBRLShort(capTotal);
      capTotalEl.style.color = capTotal >= 0 ? '#ffffff' : '#ffd0cb';
    }

    mountFiltros();
    render();

    try {
      const stamp = await fetchSheetCell(SHEET_ID, TAB_NAME, 'H1', 8000);
      setLastUpdate(stamp);
    } catch (e) {
      setLastUpdate();
    }
  } catch (err) {
    document.getElementById('content').innerHTML =
      '<div class="error-box">⚠️ Não foi possível carregar os dados.<br><small>' + err.message + '</small><br><small>Verifique se a planilha está compartilhada como "Qualquer pessoa com o link – Leitor".</small></div>';
  }
}

renderNav('captacao');
startClock('clock');
load();
setInterval(load, 60000);
setTimeout(() => location.reload(), 1 * 60 * 60 * 1000);
</script>
</body>
</html>
